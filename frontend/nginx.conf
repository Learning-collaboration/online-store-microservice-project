server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    # Docker internal DNS resolver required for variable-based proxy_pass
    resolver 127.0.0.11 valid=30s;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Auth Service (Java - port 8081) - handles optional duplicate /auth/auth/
    location ~ ^/api/auth(?:/auth)?/(.*)$ {
        proxy_pass http://auth-service:8081/auth/$1?$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Catalog Service (Go - port 8082)
    location ~ ^/api/catalog/(.*)$ {
        proxy_pass http://catalog-service:8082/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Inventory Service (Node.js - port 8083)
    location ~ ^/api/inventory/(.*)$ {
        proxy_pass http://inventory-service:8083/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Order Service (Python - port 8084)
    location ~ ^/api/orders/(.*)$ {
        proxy_pass http://order-service:8084/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5. Payment Service (C# / .NET - port 8085)
    location ~ ^/api/payments/(.*)$ {
        proxy_pass http://payment-service:8085/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. Notification Service (Ruby - port 8086)
    location ~ ^/api/notifications/(.*)$ {
        proxy_pass http://notification-service:8086/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Analytics Service (PHP - port 8087)
    location ~ ^/api/analytics/(.*)$ {
        proxy_pass http://analytics-service:8087/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    # Cache static assets aggressively for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Essential security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}