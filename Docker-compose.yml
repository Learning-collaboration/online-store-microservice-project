networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

services:
  # ==========================================
  # Database Engine
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: shared-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      # Default fallback DB created by official image
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      # Persistent storage across container restarts
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization script to create the 4 microservice DBs on first launch
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Microservices Requiring Databases
  # ==========================================

  # 1. Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - DB_USER=postgres
      - AUTH_DB_URL=jdbc:postgresql://postgres:5432/auth_db
      - DB_PASSWORD=postgrespassword
    depends_on:
      postgres:
        condition: service_healthy  # Waits for DB to be healthy and init script finished
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 260M

  # 2. Drug Catalog Service
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    environment:
      - CATALOG_DB_DSN=postgres://postgres:postgrespassword@postgres:5432/catalog_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 260M

  # 3. Inventory Service
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    environment:
      - INVENTORY_DB_URL=postgres://postgres:postgrespassword@postgres:5432/inventory_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 260M

  # 4. Analytics Service
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      - ANALYTICS_DB_DSN=pgsql:host=postgres;port=5432;dbname=analytics_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - CATALOG_URL=http://catalog-service:8082
      - INVENTORY_URL=http://inventory-service:8083
      - ORDER_URL=http://order-service:8084
      - PAYMENT_URL=http://payment-service:8085
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 260M

  
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      - ORDER_DB_DSN=dbname=order_db user=postgres password=postgrespassword host=postgres port=5432
      - CATALOG_URL=http://catalog-service:8082
      - INVENTORY_URL=http://inventory-service:8083
      - NOTIFICATION_URL=http://notification-service:8086
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 260M


  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      - NOTIFICATION_DB_URL=postgres://postgres:postgrespassword@postgres:5432/notification_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 200M


  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      - PAYMENT_DB_URL=Host=postgres;Port=5432;Database=payment_db;Username=postgres;Password=postgrespassword
      - ORDER_URL=http://order-service:8084
      - INVENTORY_URL=http://inventory-service:8083
      - NOTIFICATION_URL=http://notification-service:8086
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 260M


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8083
      - ORDERS_SERVICE_URL=http://order-service:8084
      - PAYMENTS_SERVICE_URL=http://payment-service:8085
      - NOTIFICATIONS_SERVICE_URL=http://notification-service:8086
      - ANALYTICS_SERVICE_URL=http://analytics-service:8087
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 260M

  